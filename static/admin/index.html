  <body>
    <!-- استدعاء النسخة المستقرة من Decap CMS -->
    <script src="https://unpkg.com@^3.1.0/dist/decap-cms.js"></script>
    <script>
      // كود إضافي للتأكد من فتح أداة تسجيل الدخول تلقائياً عند تأكيد الحساب
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
