backend:
  name: github
  repo: bohmaed/first-blog
  branch: main

media_folder: "static/uploads"
public_folder: "/uploads"

collections:
  - name: "posts"
    label: "المقالات"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "العنوان", name: "title", widget: "string" }
      - { label: "التاريخ", name: "date", widget: "datetime" }
      - { label: "الوصف", name: "summary", widget: "text" }
      - { label: "نص المقال", name: "body", widget: "markdown" }
